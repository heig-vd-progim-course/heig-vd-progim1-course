[project]
site_url = "https://heig-vd-progim-course.github.io/heig-vd-progim1-course/"
site_name = "HEIG-VD ProgIM1 Course"
site_description = "Le dépôt du cours Programmation 1 (ProgIM1) enseigné à la HEIG-VD, Suisse."
site_author = "Guidoux V."

copyright = "Creative Commons Attribution-ShareAlike 4.0 International"

repo_url = "https://github.com/heig-vd-progim-course/heig-vd-progim1-course"
repo_name = "heig-vd-progim-course/heig-vd-progim1-course"
edit_uri = "edit/main/docs/"

# Quiz à choix multiples et problèmes de Parsons du support, avec les confettis
# du cours UPInfo
extra_css = ["stylesheets/quiz.css", "stylesheets/parsons.css"]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.4.0/tsparticles.confetti.bundle.min.js",
  "javascripts/quiz.js",
  "javascripts/parsons.js",
]

# Les tables en ligne TOML doivent tenir sur une seule ligne : ne pas retourner
# à la ligne à l'intérieur d'une accolade, sinon le fichier ne se parse plus.
nav = [
  { "Accueil" = "index.md" },
  { "Organisation" = [{ "Modalités de l'unité d'enseignement" = "00-organisation/index.md" }, { "Évaluation" = "00-organisation/01-evaluation.md" }, { "Mini-projet - Code secret" = "00-organisation/02-mini-projet.md" }, { "Environnement de travail et outils" = "00-organisation/03-environnement-et-outils.md" }] },
  { "Séances" = [{ "Programme" = "01-seances/index.md" }, { "01 - Donner des instructions" = [{ "Vue d'ensemble" = "01-seances/01-donner-des-instructions/index.md" }, { "Activité - Donner des instructions" = "01-seances/01-donner-des-instructions/01-activite-donner-des-instructions.md" }, { "Les diagrammes d'activité" = "01-seances/01-donner-des-instructions/02-diagrammes-dactivite.md" }, { "Activité - Les règles du jeu" = "01-seances/01-donner-des-instructions/03-activite-jeux-de-societe.md" }, { "Apprendre à apprendre" = "01-seances/01-donner-des-instructions/04-apprendre-a-apprendre.md" }] }, { "02 - Programmer sans écrire de code" = [{ "Vue d'ensemble" = "01-seances/02-programmer-sans-ecrire-de-code/index.md" }, { "Phase 1 - Observer" = "01-seances/02-programmer-sans-ecrire-de-code/01-observer.md" }, { "Phase 2 - Modifier" = "01-seances/02-programmer-sans-ecrire-de-code/02-modifier.md" }, { "Phase 3 - Créer" = "01-seances/02-programmer-sans-ecrire-de-code/03-creer.md" }] }, { "03 - Premiers pas en Java" = [{ "Vue d'ensemble" = "01-seances/03-premiers-pas-en-java/index.md" }, { "Atelier - Installer son environnement" = "01-seances/03-premiers-pas-en-java/01-installer-son-environnement.md" }, { "La machine virtuelle et la compilation" = "01-seances/03-premiers-pas-en-java/02-machine-virtuelle-et-compilation.md" }, { "Les types et les variables" = "01-seances/03-premiers-pas-en-java/03-types-et-variables.md" }] }, { "04 - Du diagramme au code" = [{ "Vue d'ensemble" = "01-seances/04-du-diagramme-au-code/index.md" }, { "Les opérations arithmétiques" = "01-seances/04-du-diagramme-au-code/01-operations-arithmetiques.md" }, { "Activité - Poser le problème" = "01-seances/04-du-diagramme-au-code/02-activite-poser-le-probleme.md" }, { "Lire au clavier" = "01-seances/04-du-diagramme-au-code/03-lire-au-clavier.md" }, { "Afficher un résultat lisible" = "01-seances/04-du-diagramme-au-code/04-afficher-un-resultat.md" }, { "Atelier - Du diagramme au code" = "01-seances/04-du-diagramme-au-code/05-atelier-du-diagramme-au-code.md" }] }, { "05 - Fonctions et portée des variables" = [{ "Vue d'ensemble" = "01-seances/05-fonctions-et-portee/index.md" }, { "Les fonctions et la portée des variables" = "01-seances/05-fonctions-et-portee/01-fonctions-et-portee.md" }, { "Atelier - Découper en fonctions" = "01-seances/05-fonctions-et-portee/02-atelier-decouper-en-fonctions.md" }, { "Live coding - L'ordre des arguments" = "01-seances/05-fonctions-et-portee/03-live-coding-ordre-des-arguments.md" }] }, { "06 - Conditions" = [{ "Vue d'ensemble" = "01-seances/06-conditions/index.md" }, { "Décider avec if et else" = "01-seances/06-conditions/01-decider-avec-if.md" }, { "Atelier - Décider" = "01-seances/06-conditions/02-atelier-decider.md" }, { "Plusieurs cas et opérateurs logiques" = "01-seances/06-conditions/03-plusieurs-cas-et-operateurs-logiques.md" }, { "Activité - Des conditions en quatuor" = "01-seances/06-conditions/activite-des-conditions-en-quatuor.md" }, { "Atelier - Couvrir tous les cas" = "01-seances/06-conditions/04-atelier-couvrir-tous-les-cas.md" }, { "switch et l'opérateur ternaire" = "01-seances/06-conditions/05-switch-et-ternaire.md" }] }, { "07 - Boucles" = [{ "Vue d'ensemble" = "01-seances/07-boucles/index.md" }, { "Répéter avec while" = "01-seances/07-boucles/01-repeter-avec-while.md" }, { "Activité - Des boucles en chair et en os" = "01-seances/07-boucles/02-activite-boucles-en-chair-et-en-os.md" }, { "Atelier - Dérouler et réparer" = "01-seances/07-boucles/03-atelier-derouler-et-reparer.md" }, { "for et do-while" = "01-seances/07-boucles/04-for-et-do-while.md" }, { "Atelier - for et FizzBuzz" = "01-seances/07-boucles/05-atelier-for-et-fizzbuzz.md" }] }, { "08 - Tableaux et lancement du mini-projet" = [{ "Vue d'ensemble" = "01-seances/08-tableaux-et-lancement-du-mini-projet/index.md" }, { "Ranger dans un tableau" = "01-seances/08-tableaux-et-lancement-du-mini-projet/01-ranger-dans-un-tableau.md" }, { "Activité - Des tableaux en quatuor" = "01-seances/08-tableaux-et-lancement-du-mini-projet/02-activite-des-tableaux-en-quatuor.md" }, { "Parcourir pour calculer" = "01-seances/08-tableaux-et-lancement-du-mini-projet/03-parcourir-pour-calculer.md" }, { "Atelier - Tableaux" = "01-seances/08-tableaux-et-lancement-du-mini-projet/04-atelier-tableaux.md" }, { "Code secret - Étape 1" = "01-seances/08-tableaux-et-lancement-du-mini-projet/05-code-secret-etape-1.md" }] }, { "09 - Tableaux à deux dimensions" = "01-seances/09-tableaux-a-deux-dimensions.md" }, { "10 - Exceptions" = "01-seances/10-exceptions.md" }, { "11 - Hasard et tri" = "01-seances/11-hasard-et-tri.md" }, { "12 - Git et bilan" = "01-seances/12-git-et-bilan.md" }] },
  { "Ressources" = "99-ressources/index.md" },
  { "Équipe enseignante" = [{ "Vue d'ensemble" = "98-equipe-enseignante/index.md" }, { "01 - Donner des instructions" = "98-equipe-enseignante/01-donner-des-instructions.md" }, { "02 - Programmer sans écrire de code" = "98-equipe-enseignante/02-programmer-sans-ecrire-de-code.md" }, { "03 - Premiers pas en Java" = "98-equipe-enseignante/03-premiers-pas-en-java.md" }, { "04 - Du diagramme au code" = "98-equipe-enseignante/04-du-diagramme-au-code.md" }, { "05 - Fonctions et portée des variables" = "98-equipe-enseignante/05-fonctions-et-portee.md" }, { "06 - Conditions" = "98-equipe-enseignante/06-conditions.md" }, { "07 - Boucles" = "98-equipe-enseignante/07-boucles.md" }, { "08 - Tableaux et lancement du mini-projet" = "98-equipe-enseignante/08-tableaux-et-lancement-du-mini-projet.md" }] },
]

[project.theme]
language = "fr"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Basculer en mode clair"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Basculer en mode sombre"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Suivre les préférences du système"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/heig-vd-progim-course/heig-vd-progim1-course"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
pymdownx.arithmatex = { generic = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
