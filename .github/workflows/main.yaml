name: HEIG-VD ProgIM1 Course GitHub Workflow

# N'autoriser qu'un seul deploiement a la fois
concurrency:
  group: GitHub Pages
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generer les diagrammes avec PlantUML
        run: ./generate-diagrams.sh

      - name: Generer les presentations avec Marp
        uses: docker://marpteam/marp-cli:v4.1.1
        with:
          entrypoint: sh
          args: generate-presentations.sh

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Installer Zensical
        run: pip install zensical

      - name: Construire le site
        run: zensical build --clean

      - name: Televerser le site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 1

  deploy:
    # Ne deployer que sur `main` et sur les tags, pas sur les pull requests
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Telecharger le site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Preparer l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
