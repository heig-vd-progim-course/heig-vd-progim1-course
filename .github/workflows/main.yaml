name: HEIG-VD ProgIM1 Course GitHub Workflow

# N'autoriser qu'un seul deploiement a la fois
concurrency:
  group: GitHub Pages
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      # Essai temporaire : cette branche se deploie sur le site public, a la
      # place de `main`, jusqu'au prochain push sur `main`. A retirer avant de
      # fusionner.
      - essai-java-executable
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Version d'Ubuntu fixee : `ubuntu-latest` change de version sans prevenir
# (Ubuntu 26 a partir d'octobre 2026). On monte de version quand on le decide.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generer les diagrammes avec PlantUML
        run: bash generate-diagrams.sh

      - name: Generer les presentations avec Marp
        uses: docker://marpteam/marp-cli:v4.1.1
        with:
          entrypoint: sh
          args: generate-presentations.sh

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Installer Zensical
        run: pip install zensical

      # Fichiers de TeaVM, non versionnes (voir `.gitignore`). teavm.org ne
      # permet pas de les charger depuis un autre site, il faut les copier.
      - name: Telecharger TeaVM pour l'essai de Java executable
        run: |
          mkdir -p docs/vendor/teavm
          for file in compiler.wasm compiler.wasm-runtime.js compile-classlib-teavm.bin runtime-classlib-teavm.bin; do
            curl -sSfL -o "docs/vendor/teavm/$file" "https://teavm.org/playground/3/$file"
          done

      - name: Construire le site
        run: zensical build --clean

      - name: Televerser le site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 1

  deploy:
    # Ne deployer que sur les push (`main`, les tags et la branche d'essai),
    # pas sur les pull requests
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Telecharger le site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Preparer l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
